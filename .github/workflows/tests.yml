name: Tests
on: [push, pull_request]
jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.12'
      - run: uv sync --locked --extra dev
      - run: uv run pytest
        env:
          QT_QPA_PLATFORM: offscreen
      - name: Check Windows launcher
        shell: powershell
        run: .\WindowsLaunchers\Install-BiBaZuShortcuts.ps1 -CheckOnly
